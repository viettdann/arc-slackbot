display_information:
  name: Claude Bot
  description: Run Claude Code agents in mapped project folders from Slack.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: claude
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  slash_commands:
    - command: /claude
      description: Show active runs or stop a run
      usage_hint: "status | stop [#channel]"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - reactions:write
      - files:read
      - files:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
